<!DOCTYPE html>
<html>

<head>
    <title>Bank Deposit Predictor</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Bank Marketing Response Prediction</h1>

    <form action="/predict" method="POST">

        <input type="number" name="age" placeholder="Age" required>

        <input type="text" name="job" placeholder="Job" required>

        <input type="text" name="marital" placeholder="Marital Status" required>

        <input type="text" name="education" placeholder="Education" required>

        <input type="text" name="default" placeholder="Default (yes/no)" required>

        <input type="number" name="balance" placeholder="Balance" required>

        <input type="text" name="housing" placeholder="Housing Loan (yes/no)" required>

        <input type="text" name="loan" placeholder="Personal Loan (yes/no)" required>

        <input type="text" name="contact" placeholder="Contact Type" required>

        <input type="number" name="day" placeholder="Day" required>

        <input type="text" name="month" placeholder="Month" required>

        <input type="number" name="duration" placeholder="Duration" required>

        <input type="number" name="campaign" placeholder="Campaign" required>

        <input type="number" name="pdays" placeholder="Pdays" required>

        <input type="number" name="previous" placeholder="Previous" required>

        <input type="text" name="poutcome" placeholder="Poutcome" required>

        <button type="submit">
            Predict
        </button>

    </form>

    {% if prediction %}

    <div class="result">

        <h2>Prediction : {{ prediction }}</h2>

        <h3>Probability : {{ probability }}%</h3>

    </div>

    {% endif %}

</div>

</body>
</html>
